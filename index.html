<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetly</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">

            <a class="logo">
            <img src="img/logo-sweetly.png" alt="Logo Sweetly">
        </a>

            <h3>Bem-vindo de volta!</h3>

            <form>
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="sweetly@email.com"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="•••••••"
                    required
                >

                <a href="#" class="esqueceu-senha">
                    Esqueceu sua senha?
                </a>
                
                <button type="submit">Entrar</button> 
            </form> 
            
            <p class="separador">ou</p>
            
            <div class="login-google">
                <img src="img/logo-google.png" alt="Google">
                <span>Entrar com Google</span>
            </div>
            
            <p class="cadastro">
                Ainda não tem conta?
                <a href="#">Cadastre-se</a>
            </p>

        </div>
    </div>

</body>
</html>
